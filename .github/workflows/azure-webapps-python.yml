name: Deploy Django to Azure

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies and generate requirements
        run: |
          python -m pip install --upgrade pip
          pip install \
            "django>=5.0,<6.0" \
            "djangorestframework>=3.15,<4.0" \
            "djangorestframework-simplejwt>=5.3,<6.0" \
            "django-cors-headers>=4.4,<5.0" \
            "python-dotenv>=1.0,<2.0" \
            "python-jose[cryptography]>=3.3,<4.0" \
            "requests>=2.31,<3.0" \
            "pandas>=2.2,<3.0" \
            "numpy>=1.26,<3.0" \
            "google-api-python-client>=2.130,<3.0" \
            mssql-django gunicorn whitenoise beautifulsoup4
          pip freeze > requirements.txt

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_07313D8B99284CAF8E842DD89373791B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3301B1372B0B40FFAEED95473ABD28C1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D53D856CBD514BD6B7D2E780A59F3D74 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'mt-scrapper'
          package: .
