name: Deploy Django to Azure

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

# Permisos necesarios para el intercambio de tokens con Azure (OIDC)
permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies and generate requirements
        run: |
          python -m pip install --upgrade pip
          pip install django gunicorn whitenoise djangorestframework django-cors-headers
          pip install requests beautifulsoup4 python-dotenv mssql-django
          pip install djangorestframework-simplejwt "python-jose[cryptography]"
          pip freeze > requirements.txt

      - name: Zip artifact for deployment
        run: zip release.zip ./* -r

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: release.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Unzip artifact
        run: unzip release.zip

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_07313D8B99284CAF8E842DD89373791B }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_3301B1372B0B40FFAEED95473ABD28C1 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D53D856CBD514BD6B7D2E780A59F3D74 }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3 # Usando v3 para mejor compatibilidad con OIDC
        with:
          app-name: 'mt-scrapper'
          package: . # Despliega el contenido extraído en el paso anterior
